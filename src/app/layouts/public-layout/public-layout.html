<header class="encabezado">
  <div class="encabezado__interior">
    <a class="marca" routerLink="/">cineShop</a>
    <nav class="acceso">
  @if (usuario()) {
    <span class="saludo">Hola, {{ perfil()?.nombre ?? 'invitado' }}</span>
    <button type="button" class="boton" (click)="salir()">Salir</button>
  } @else {
    <button type="button" class="boton" (click)="panel().abrir()">Ingresar</button>
  }
</nav>
  </div>
  
</header>

<main class="contenido">
  <router-outlet />
</main>

<footer class="pie">
  <p>cineShop © {{ anio }}</p>
</footer>
<app-panel-lateral>
  <app-ingreso (ingresado)="panel().cerrar()" />
</app-panel-lateral>
