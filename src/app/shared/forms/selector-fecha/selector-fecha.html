<!--
  Cada <option> marca si está elegida con [selected]. No alcanza con [value] en el
  <select>: Angular lo asigna antes de que el @for dibuje las opciones y, si la fecha
  ya venía cargada (por ejemplo, el período por defecto de Reportes), quedaba en blanco.
-->
<div class="selector-fecha">
  <select [disabled]="deshabilitado()" (change)="cambiar('dia', $event)" aria-label="Día">
    <option value="" [selected]="!dia()">Día</option>
    @for (d of dias(); track d) {
      <option [value]="d" [selected]="String(d) === dia()">{{ d }}</option>
    }
  </select>

  <select [disabled]="deshabilitado()" (change)="cambiar('mes', $event)" aria-label="Mes">
    <option value="" [selected]="!mes()">Mes</option>
    @for (m of mesesDisponibles(); track m) {
      <option [value]="m" [selected]="String(m) === mes()">{{ meses.at(m - 1) }}</option>
    }
  </select>

  <select [disabled]="deshabilitado()" (change)="cambiar('anio', $event)" aria-label="Año">
    <option value="" [selected]="!anio()">Año</option>
    @for (a of anios(); track a) {
      <option [value]="a" [selected]="String(a) === anio()">{{ a }}</option>
    }
  </select>
</div>
