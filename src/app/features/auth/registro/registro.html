<h2>Crear cuenta</h2>

<form [formGroup]="formulario" (ngSubmit)="enviar()" class="formulario">
  <label>
    Nombre
    <input type="text" formControlName="nombre" />
    @if (formulario.controls.nombre.touched && formulario.controls.nombre.invalid) {
      <small class="error">Ingresá tu nombre.</small>
    }
  </label>

  <label>
    Apellido
    <input type="text" formControlName="apellido" />
    @if (formulario.controls.apellido.touched && formulario.controls.apellido.invalid) {
      <small class="error">Ingresá tu apellido.</small>
    }
  </label>

  <label>
    Correo electrónico
    <input type="email" formControlName="email" />
    @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
      <small class="error">Ingresá un correo válido.</small>
    }
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" />
    @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
      <small class="error">Usá al menos 6 caracteres.</small>
    }
  </label>

   <label>
    Fecha de nacimiento
    <app-selector-fecha formControlName="fechaNacimiento" />
  </label>

  <label>
    Tipo de sangre
    <select formControlName="tipoSangre">
      <option value="">Elegí una opción</option>
      @for (tipo of tiposSangre; track tipo) {
        <option [value]="tipo">{{ tipo }}</option>
      }
    </select>
  </label>

  <label>
    Color de ojos
    <select formControlName="colorOjos">
      <option value="">Elegí una opción</option>
      @for (color of coloresOjos; track color) {
        <option [value]="color">{{ color }}</option>
      }
    </select>
  </label>

  <label>
    Días de vacaciones por año
    <input type="number" formControlName="diasVacaciones" min="0" max="365" />
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Creando cuenta…' : 'Crear cuenta' }}
  </button>

</form>
