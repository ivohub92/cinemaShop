<h2 class="titulo">Ingresar</h2>

<form [formGroup]="formulario" (ngSubmit)="enviar()" class="formulario">
  <label>
    Correo electrónico
    <input type="email" formControlName="email" autocomplete="email" />
    @if (formulario.controls.email.touched && formulario.controls.email.hasError('required')) {
      <small class="error">Ingresá tu correo.</small>
    } @else if (formulario.controls.email.touched && formulario.controls.email.hasError('pattern')) {
      <small class="error">El correo no es válido. Tiene que ser como nombre&#64;dominio.com</small>
    }
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" autocomplete="current-password" />
    @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
      <small class="error">Ingresá tu contraseña.</small>
    }
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" class="boton" [disabled]="enviando()">
    {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
  </button>
</form>

<p class="registro">
  ¿Todavía no tenés cuenta?
  <a routerLink="/registro">Creá una</a>
</p>
