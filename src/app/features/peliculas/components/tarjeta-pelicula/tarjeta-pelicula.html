<a class="tarjeta" [routerLink]="['/peliculas', pelicula().id]">
  <article appPosterHover>
    <div class="poster">
      <img [src]="pelicula().posterUrl" [alt]="'Póster de ' + pelicula().titulo" width="400" height="600" appImagenRespaldo />

      <span class="edad"
          [ngClass]="{
            'edad--atp': pelicula().restriccionEdad === 0,
            'edad--13': pelicula().restriccionEdad === 13,
            'edad--18': pelicula().restriccionEdad === 18
          }"
      >
          {{ etiquetaEdad() }}
      </span>
    </div>

      <h2>{{ pelicula().titulo }}</h2>

  @if (pelicula().promedio !== null) {
    <p class="puntaje">
      <app-selector-estrellas
        [soloLectura]="true"
        [ngModel]="pelicula().promedio"
        [ngModelOptions]="{ standalone: true }"
      />
      <span>{{ pelicula().promedio }} ({{ pelicula().cantidadResenias }})</span>
    </p>
  }

  <p>{{ pelicula().generos.join(', ') }} — {{ pelicula().duracionMin }} min</p>
  </article>
</a>
